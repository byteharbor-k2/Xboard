spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

management:
  server:
    port: ${MANAGEMENT_PORT:9091}

sinx:
  security:
    jwt-secret: ${SECURITY_JWT_SECRET}
    mfa-encryption-key: ${MFA_ENCRYPTION_KEY}
    secure-cookies: ${SECURE_COOKIES:true}
  registration:
    turnstile-enabled: true
    turnstile-site-key: ${TURNSTILE_SITE_KEY}
    turnstile-secret-key: ${TURNSTILE_SECRET_KEY}
  mail:
    delivery: smtp
