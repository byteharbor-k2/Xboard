spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

management:
  server:
    port: ${MANAGEMENT_PORT:9091}

sinx:
  security:
    jwt-secret: ${SECURITY_JWT_SECRET}
    secure-cookies: true
