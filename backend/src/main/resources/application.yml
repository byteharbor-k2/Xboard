spring:
  application:
    name: sinx-platform
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  profiles:
    default: dev
  flyway:
    enabled: true
    locations: classpath:db/migration
  graphql:
    http:
      path: /gateway
    graphiql:
      enabled: false
    schema:
      printer:
        enabled: false
  jackson:
    time-zone: UTC
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
  error:
    include-binding-errors: never
    include-exception: false
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false

management:
  server:
    address: 127.0.0.1
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"

sinx:
  security:
    issuer: ${SECURITY_ISSUER:sinx-platform}
    access-token-ttl: ${ACCESS_TOKEN_TTL:10m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:30d}
    email-verification-ttl: ${EMAIL_VERIFICATION_TTL:30m}
    refresh-cookie-name: ${REFRESH_COOKIE_NAME:rt_session}
  mail:
    delivery: ${MAIL_DELIVERY:log}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
    from: ${MAIL_FROM:no-reply@dev.sinx.it.com}
