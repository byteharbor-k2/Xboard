spring:
  application:
    name: sinx-platform
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  profiles:
    default: dev
  flyway:
    enabled: true
    locations: classpath:db/migration
  graphql:
    http:
      path: /gateway
    graphiql:
      enabled: false
    schema:
      printer:
        enabled: false
  jackson:
    time-zone: UTC
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
  error:
    include-binding-errors: never
    include-exception: false
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false

management:
  server:
    address: 127.0.0.1
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"

sinx:
  node:
    billing-time-zone: ${NODE_BILLING_TIME_ZONE:Asia/Shanghai}
  security:
    issuer: ${SECURITY_ISSUER:sinx-platform}
    access-token-ttl: ${ACCESS_TOKEN_TTL:10m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:30d}
    admin-access-token-ttl: ${ADMIN_ACCESS_TOKEN_TTL:5m}
    admin-refresh-token-ttl: ${ADMIN_REFRESH_TOKEN_TTL:12h}
    password-reset-ttl: ${PASSWORD_RESET_TTL:30m}
    mfa-challenge-ttl: ${MFA_CHALLENGE_TTL:5m}
    # How long a just-rotated refresh token still resolves to its replacement,
    # so a reload racing an in-flight refresh is not mistaken for a replay.
    # Set to 0 to enforce single use with no tolerance.
    refresh-replay-window: ${REFRESH_REPLAY_WINDOW:10s}
    mfa-issuer: ${MFA_ISSUER:SinX Cloud}
    refresh-cookie-name: ${REFRESH_COOKIE_NAME:rt_session}
    admin-refresh-cookie-name: ${ADMIN_REFRESH_COOKIE_NAME:rt_admin}
  registration:
    email-code-ttl: ${REGISTRATION_EMAIL_CODE_TTL:5m}
    email-code-cooldown: ${REGISTRATION_EMAIL_CODE_COOLDOWN:60s}
    max-code-attempts: ${REGISTRATION_MAX_CODE_ATTEMPTS:5}
    max-registrations-per-ip: ${REGISTRATION_MAX_PER_IP:3}
    registration-window: ${REGISTRATION_WINDOW:60m}
    turnstile-enabled: true
    turnstile-site-key: ${TURNSTILE_SITE_KEY:}
    turnstile-secret-key: ${TURNSTILE_SECRET_KEY:}
  mail:
    delivery: ${MAIL_DELIVERY:log}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
    from: ${MAIL_FROM:no-reply@dev.sinx.it.com}
