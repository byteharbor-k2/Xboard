spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sinx}
    username: ${DATABASE_USERNAME:sinx}
    password: ${DATABASE_PASSWORD:sinx_dev_only}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  server:
    port: ${MANAGEMENT_PORT:9091}

sinx:
  security:
    jwt-secret: ${SECURITY_JWT_SECRET:dev-only-jwt-secret-change-before-production-2026}
    mfa-encryption-key: ${MFA_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    secure-cookies: ${SECURE_COOKIES:false}
  registration:
    turnstile-enabled: false
