<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流量使用提醒 / Traffic usage reminder</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5;padding:40px 20px;">
<tr><td align="center">
<table width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;">
    <!-- Logo -->
    <tr><td style="padding-bottom:24px;text-align:center;">
        <span style="font-size:20px;font-weight:700;color:#18181b;">{{name}}</span>
    </td></tr>
    <!-- Card -->
    <tr><td style="background:#ffffff;border-radius:12px;border:1px solid #e4e4e7;padding:40px;">
        <table width="100%" cellpadding="0" cellspacing="0">
            <tr><td style="font-size:22px;font-weight:700;color:#18181b;padding-bottom:8px;">流量提醒</td></tr>
            <tr><td style="font-size:15px;color:#18181b;padding-bottom:4px;">Your traffic usage has reached 80%.</td></tr>
            <tr><td style="font-size:15px;color:#52525b;line-height:1.7;padding-bottom:28px;">您的流量使用已达到80%，请注意流量使用情况。<br>
                Your traffic usage has reached 80%. Please keep an eye on how much you have left.</td></tr>
            <tr><td align="center">
                <a href="{{url}}" style="display:inline-block;background:#18181b;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;padding:12px 28px;border-radius:8px;">查看用量 / View usage</a>
            </td></tr>
        </table>
    </td></tr>
    <!-- Footer -->
    <tr><td style="padding-top:24px;text-align:center;">
        <a href="{{url}}" style="font-size:13px;color:#a1a1aa;text-decoration:none;">{{url}}</a>
        <p style="font-size:12px;color:#d4d4d8;margin:8px 0 0;">此邮件由系统自动发送，请勿直接回复。 / This is an automated message, please do not reply.</p>
    </td></tr>
</table>
</td></tr>
</table>
</body>
</html>
